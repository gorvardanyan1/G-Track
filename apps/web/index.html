<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>TEMPO</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Shown until the session check and first route are done (removed by main.ts). -->
    <div id="boot" role="status" aria-label="Loading TEMPO">
      <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#5B5BF7" />
        <circle cx="16" cy="17" r="8.5" fill="none" stroke="#fff" stroke-width="2.6" />
        <path
          d="M16 12.5V17l3 2"
          fill="none"
          stroke="#fff"
          stroke-width="2.6"
          stroke-linecap="round"
        />
        <path d="M13 6.5h6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
      </svg>
      <span class="boot-bar"></span>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f7f7f9;
        transition: opacity 180ms ease-out;
      }
      .dark #boot {
        background: #0b0b0f;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-bar {
        width: 72px;
        height: 3px;
        border-radius: 3px;
        background:
          linear-gradient(90deg, transparent, #5b5bf7, transparent) 0 0 / 50% 100% no-repeat,
          rgb(91 91 247 / 0.15);
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        from {
          background-position:
            -100% 0,
            0 0;
        }
        to {
          background-position:
            200% 0,
            0 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar {
          animation: none;
        }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
