# Local development only. Credentials here are for throwaway local databases.
name: tempo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD: tempo
      POSTGRES_DB: tempo
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tempo -d tempo']
      interval: 2s
      timeout: 3s
      retries: 20

  # Ephemeral database for integration tests: data lives in memory and is gone on restart.
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD: tempo
      POSTGRES_DB: tempo_test
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tempo -d tempo_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
